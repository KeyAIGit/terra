name: Python and data-bridge checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install simulation dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy pillow
      - name: Run simulation tests
        run: python -m tests.test_terra
      - name: Compile Unreal bridge Python
        run: >-
          python -m py_compile
          unreal/Terra/Scripts/unreal_mcp_client.py
          unreal/Terra/Scripts/terra_data/terra_bridge.py
          unreal/Terra/Scripts/terra_data/unreal_import_terra_life.py
          unreal/Terra/Scripts/terra_data/tests/test_terra_bridge.py
      - name: Run data-bridge tests
        run: python -m unittest discover -s unreal/Terra/Scripts/terra_data/tests -v
