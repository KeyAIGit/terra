name: Package Terra English Preview
on:
  push:
    branches: [terra-world-english-preview-20260917]
    paths: [web/english-preview/RELEASE.json]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build verified standalone preview
        run: node web/english-preview/build.mjs
      - name: Include reproducible source
        run: mkdir -p web/english-preview/dist/source && cp -r web/english-preview/assets web/english-preview/*.js web/english-preview/*.mjs web/english-preview/*.css web/english-preview/*.json web/english-preview/dist/source/ && cp web/english-preview/index.html web/english-preview/dist/source/index.html
      - name: Include actual browser screenshots
        run: cp -r web/english-preview/screenshots web/english-preview/dist/preview-images
      - uses: actions/upload-artifact@v4
        with:
          name: Terra-World-English-Preview
          path: web/english-preview/dist/
          if-no-files-found: error
          retention-days: 90
